<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actualités CDG</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-container">
          <div class="header-titles">
            <h1>Veille CDG</h1>
            <p>Agrégateur des publications des Centres de Gestion territoriaux</p>
          </div>
          <div class="header-actions">
            <button id="refresh-btn" class="btn-primary" aria-label="Rafraîchir les données">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="icon-refresh"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
              <span>Actualiser</span>
            </button>
          </div>
        </div>
      </header>

      <main class="app-main">
        <section class="controls-section">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="search-input" placeholder="Rechercher par mot-clé (ex: rupture, congés, retraite) ou département..." autocomplete="off" />
          </div>
          
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all">Tous les CDG</button>
            <button class="filter-btn" data-filter="has-news">Avec actualités</button>
            <button class="filter-btn" data-filter="empty">Sans actualités</button>
          </div>
        </section>

        <div id="status-toast" class="toast hidden">
          <span id="status-text"></span>
        </div>

        <div id="loading" class="loading-state" style="display: none;">
          <div class="spinner"></div>
          <p>Récupération des données en cours...</p>
        </div>
        
        <div id="news-container" class="grid-container">
          <!-- Cards will be injected here by JS -->
        </div>
      </main>

      <footer class="app-footer">
        <p>Données extraites depuis les sites des CDG. Généré via FNCDG.</p>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
